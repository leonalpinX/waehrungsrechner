<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Währungsrechner</title><style>body{font-family:system-ui;background:#101827;color:#f8fafc;margin:0;padding:24px}main{max-width:460px;margin:8vh auto}h1{font-size:26px}section{background:#1e293b;padding:20px;border-radius:20px}label{display:block;color:#cbd5e1;margin:14px 0 6px}input,select,button{box-sizing:border-box;width:100%;padding:14px;border:1px solid #475569;border-radius:12px;background:#0f172a;color:white;font-size:20px}button{margin-top:18px;background:#2563eb;border:0;cursor:pointer}#result{font-size:30px;font-weight:700;margin-top:20px;overflow-wrap:anywhere}#ecb{color:#cbd5e1;font-size:13px;line-height:1.6;margin-top:12px}#warning{color:#fbbf24;font-size:13px;line-height:1.5;font-weight:600}#status{color:#94a3b8;font-size:13px;line-height:1.5}small{color:#94a3b8}</style></head><body><main><h1>💱 Währungsrechner</h1><section><label for="amount">Betrag</label><input id="amount" inputmode="decimal" value="100"><label for="from">Von</label><select id="from"></select><label for="to">Nach</label><select id="to"></select><button id="swap">⇅ Währungen tauschen</button><div id="result">…</div><p id="status">Kurse werden geladen …</p><p id="warning" role="status"></p><div id="ecb" aria-live="polite">EZB-Vergleich wird geladen …</div></section><p><small>Referenzkurse, keine garantierten Bank- oder Kartenkurse.</small></p></main><script>const currencies=['EUR','USD','GBP','JPY','CHF','CAD','AUD','CNY','KRW','THB','TRY','SEK','NOK','DKK','PLN','CZK','HUF','INR','SGD','AED','BRL','MXN'];const a=document.querySelector('#amount'),f=document.querySelector('#from'),t=document.querySelector('#to'),r=document.querySelector('#result'),s=document.querySelector('#status');for(const el of [f,t])for(const c of currencies)el.add(new Option(c,c));f.value='EUR';t.value='USD';let rates={},updated='',cached=false,loadId=0,error='',ecbData=null,ecbError=false;function dateAge(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return null;const d=new Date(date+'T12:00:00Z');if(Number.isNaN(d.getTime()))return null;return Math.floor((Date.now()-d.getTime())/86400000)}
function refreshComparison(){const box=document.querySelector('#ecb');if(!ecbData){box.textContent=ecbError?'EZB-Vergleich momentan nicht abrufbar':'EZB-Vergleich wird geladen …';return}const x=ecbData.rates[f.value],y=ecbData.rates[t.value];if(!x||!y){box.textContent='EZB Kurs nicht verfügbar';return}const ezb=y/x;const actual=rates[t.value.toLowerCase()];if(!Number.isFinite(actual)||actual<=0){box.textContent='EZB: '+ezb.toLocaleString('de-DE',{maximumFractionDigits:6})+' '+t.value+' je '+f.value+' · '+ecbData.date;return}const diff=(actual/ezb-1)*100;box.textContent='EZB: 1 '+f.value+' = '+ezb.toLocaleString('de-DE',{maximumFractionDigits:6})+' '+t.value+' · Stand: '+ecbData.date+' · Abweichung: '+new Intl.NumberFormat('de-DE',{signDisplay:'always',maximumFractionDigits:2}).format(diff)+' %';}
function calc(){const n=Number(a.value.replace(',','.'));const warn=document.querySelector('#warning');const age=dateAge(updated);warn.textContent='';if(cached)warn.textContent='⚠ Offline/Cache: gespeicherter Kurs'+(updated?' vom '+updated:' (Datum unbekannt)')+'.';else if(age===null)warn.textContent='⚠ Kursdatum nicht verfügbar.';else if(age>3)warn.textContent='⚠ Achtung: Kurs vom '+updated+' ('+age+' Tage alt).';else if(age>0)warn.textContent='Hinweis: Kursstand '+updated+'. Wochenenden und Feiertage können die Aktualisierung verzögern.';if(!a.value.trim()||!Number.isFinite(n)){r.textContent='Bitte Betrag eingeben';refreshComparison();return}if(!Number.isFinite(rates[t.value.toLowerCase()])){r.textContent='Kurs nicht verfügbar';s.textContent=error||'Kurse werden geladen …';refreshComparison();return}const rate=rates[t.value.toLowerCase()];r.textContent=new Intl.NumberFormat('de-DE',{style:'currency',currency:t.value,maximumFractionDigits:2}).format(n*rate);s.textContent=`1 ${f.value} = ${rate.toLocaleString('de-DE',{maximumFractionDigits:6})} ${t.value} · ${cached?'Gespeicherter Kurs':'Online-Kurs'}${updated?' · Stand: '+updated:''}`;refreshComparison();}
async function loadEcb(){try{const response=await fetch('https://api.frankfurter.dev/v2/providers/ecb/rates?base=EUR',{cache:'no-store'});if(!response.ok)throw Error('EZB HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw Error('EZB-Antwortformat ungültig');const values={EUR:1};let date='';for(const item of data){const code=(item.quote||'').toUpperCase();if(item.base?.toUpperCase()==='EUR'&&code&&Number.isFinite(item.rate)&&item.rate>0){values[code]=item.rate;if(item.date>date)date=item.date}}if(!date||!Number.isFinite(values.USD))throw Error('EZB-Daten unvollständig');ecbData={date,rates:values};ecbError=false;try{localStorage.setItem('fx_ecb',JSON.stringify(ecbData))}catch(e){}}catch(e){console.warn('EZB-Abruf:',e);try{const saved=JSON.parse(localStorage.getItem('fx_ecb'));if(saved?.rates&&saved?.date){ecbData=saved;ecbError=false}else ecbError=true}catch(e){ecbError=true}}refreshComparison()}
async function load(){const id=++loadId,base=f.value.toLowerCase(),key='fx_'+base;rates={};error='';r.textContent='…';s.textContent='Kurse werden geladen …';const urls=[`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${base}.min.json`,`https://latest.currency-api.pages.dev/v1/currencies/${base}.min.json`];for(const url of urls){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6500);let response;try{response=await fetch(url,{signal:controller.signal,cache:'no-cache'})}finally{clearTimeout(timer)}if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!data[base]||typeof data[base].usd!=='number')throw Error('Ungültige Kursdaten');if(id!==loadId)return;rates=data[base];updated=data.date||'';cached=false;try{localStorage.setItem(key,JSON.stringify({rates,updated}))}catch(e){}calc();return}catch(e){console.warn('Kursquelle nicht erreichbar:',url,e)}}if(id!==loadId)return;try{const saved=localStorage.getItem(key);if(saved){const d=JSON.parse(saved);if(d.rates){rates=d.rates;updated=d.updated||'';cached=true;calc();return}}}catch(e){}error='Kursabruf fehlgeschlagen. Bitte Internetverbindung prüfen oder App über HTTPS öffnen.';calc()}f.addEventListener('change',load);t.addEventListener('change',calc);a.addEventListener('input',calc);document.querySelector('#swap').onclick=()=>{const x=f.value;f.value=t.value;t.value=x;load()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();loadEcb();</script></body></html>
